x-database-url: &database-url file:/app/data/tasks.db

services:
  migrate:
    build:
      context: ./backend
      target: migrate
    environment:
      DATABASE_URL: *database-url
    user: node
    volumes:
      - sqlite_data:/app/data

  api:
    build:
      context: ./backend
      target: runtime
    environment:
      DATABASE_URL: *database-url
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4}
    volumes:
      - sqlite_data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 15

  frontend:
    build: ./frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/index.html"]
      interval: 2s
      timeout: 3s
      retries: 15

  nginx:
    image: nginx:stable-alpine
    volumes:
      - ./infra/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    depends_on:
      frontend:
        condition: service_healthy
        restart: true
      api:
        condition: service_healthy
        restart: true

volumes:
  sqlite_data:
